<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="t">
  <title id="t">Sub2API on Cloudflare</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { .dot { display: none; } }
  </style>
  <text x="600" y="82" text-anchor="middle" font-size="46" font-weight="700" letter-spacing="-0.5" fill="#f0f6fc">Sub2API on Cloudflare</text>
  <text x="600" y="120" text-anchor="middle" font-size="19" fill="#8b949e">No Go server. No PostgreSQL. No Redis.</text>

  <g font-size="15" fill="#8b949e" text-anchor="middle">
    <text x="470" y="170">Browser</text>
    <text x="600" y="170">Worker</text>
    <text x="730" y="170">D1</text>
  </g>
  <line x1="508" y1="165" x2="565" y2="165" stroke="#3d444d" stroke-width="1.5"/>
  <line x1="635" y1="165" x2="708" y2="165" stroke="#3d444d" stroke-width="1.5"/>
  <circle class="dot" r="3.5" cy="165" fill="#F38020">
    <animate attributeName="cx" values="508;565;565" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1;0.5;1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle class="dot" r="3.5" cy="165" fill="#F38020">
    <animate attributeName="cx" values="635;708;708" keyTimes="0;0.5;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.1;0.5;1" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
