<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
  <title id="t">Sub2API on Cloudflare</title>
  <desc id="d">Browser to Cloudflare Worker to D1, with no Go server, PostgreSQL or Redis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#14204a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0; 0.4 0; -0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .flow { stroke-dasharray: 6 8; animation: dash 1.4s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    .node { animation: pulse 3.6s ease-in-out infinite; }
    .n2 { animation-delay: 1.2s; }
    .n3 { animation-delay: 2.4s; }
    @keyframes pulse { 0%, 100% { stroke-opacity: 0.35; } 50% { stroke-opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .node { animation: none; }
    }
  </style>

  <rect width="1200" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="20" fill="url(#glow)"/>

  <text x="600" y="108" text-anchor="middle" font-size="58" font-weight="700" letter-spacing="-1" fill="url(#accent)">Sub2API on Cloudflare</text>
  <text x="600" y="152" text-anchor="middle" font-size="22" fill="#9fb0d0">No Go server. No PostgreSQL. No Redis.</text>

  <!-- links between nodes -->
  <line class="flow" x1="388" y1="250" x2="512" y2="250" stroke="#60a5fa" stroke-opacity="0.7" stroke-width="2"/>
  <line class="flow" x1="688" y1="250" x2="812" y2="250" stroke="#60a5fa" stroke-opacity="0.7" stroke-width="2"/>

  <!-- travelling packets -->
  <circle r="5" fill="#5eead4">
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M388 250 H512"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#a78bfa">
    <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M688 250 H812"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes -->
  <g>
    <rect class="node" x="208" y="218" width="180" height="64" rx="14" fill="#0f1730" stroke="#5eead4" stroke-width="1.5"/>
    <text x="298" y="256" text-anchor="middle" font-size="20" font-weight="600" fill="#e6edf8">Browser</text>
  </g>
  <g>
    <rect class="node n2" x="512" y="218" width="176" height="64" rx="14" fill="#0f1730" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="600" y="256" text-anchor="middle" font-size="20" font-weight="600" fill="#e6edf8">Worker</text>
  </g>
  <g>
    <rect class="node n3" x="812" y="218" width="180" height="64" rx="14" fill="#0f1730" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="902" y="256" text-anchor="middle" font-size="20" font-weight="600" fill="#e6edf8">D1</text>
  </g>
</svg>
